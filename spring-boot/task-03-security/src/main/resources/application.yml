spring:
  application:
    name: crud-security
  datasource:
    url: jdbc:h2:mem:products;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      authorizationserver:
        client:
          crud-client:
            registration:
              client-id: crud-client
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://127.0.0.1:8080/authorized
              scopes:
                - openid
            require-proof-key: true
            token:
              access-token-time-to-live: 15m
