spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/products_dev
    username: ${DB_USERNAME:products}
    password: ${DB_PASSWORD:products}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.epam.homework: DEBUG
