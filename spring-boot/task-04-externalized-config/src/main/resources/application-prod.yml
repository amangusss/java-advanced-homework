spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:prod-db.internal}:5432/products_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.epam.homework: INFO
